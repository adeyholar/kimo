name: release

# Builds every downloadable artifact and, on a v* tag, attaches them to a DRAFT
# GitHub release. Nothing is ever published by this workflow: a maintainer reviews
# the draft and clicks "Publish" by hand.
#
#   push tag v*         -> build everything, SHA256SUMS, create/update a DRAFT release
#   workflow_dispatch   -> dry run: build everything, upload workflow artifacts and
#                          SHA256SUMS, no release (unless run on a v* tag with
#                          draft_release ticked)
#
# Unsigned on purpose: no secrets, no certificates, GitHub-hosted runners only.
# Every third-party action is pinned to a full commit SHA (tag in the comment).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "When run on a v* tag: also attach the artifacts to a DRAFT release (never published). Off = dry run, workflow artifacts only."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04   # old glibc baseline for the gnu build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary: fully static, runs on any x86_64 Linux regardless of glibc.
          - target: x86_64-unknown-linux-musl
            suffix: linux-x86_64-static
          # Optional: dynamic glibc build (needs glibc >= 2.35), usually faster allocator.
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64-glibc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          rustc -V

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build (default features, no OCIO)
        run: cargo build --release --locked -p kimo-mcp --target ${{ matrix.target }}

      - name: Fetch bundled fonts (SIL OFL)
        run: |
          bash fonts/fetch.sh
          n=$(find fonts -maxdepth 1 -name '*.ttf' -size +10k | wc -l)
          echo "fonts: $n"
          # fetch.sh swallows download errors, so fail on a short or empty set
          test "$n" -ge 70
          find fonts -maxdepth 1 -name '*.ttf' -size -10k -print -quit | grep -q . && { echo "truncated font"; exit 1; } || true

      - name: Smoke test the built binary
        run: |
          bin=target/${{ matrix.target }}/release/kimo-mcp
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | KIMO_FONTS=$PWD/fonts "$bin")
          echo "$out" | head -1 | grep -q '"serverInfo"'
          echo "$out" | tail -1 | python3 -c 'import sys,json; n=len(json.loads(sys.stdin.read())["result"]["tools"]); print("tools:",n); assert n>=16'

      - name: Package
        id: pkg
        run: |
          ver="${GITHUB_REF_NAME//\//-}"
          name="kimo-${ver}-${{ matrix.suffix }}"
          mkdir -p "dist/$name/bin" "dist/$name/fonts"
          install -m755 target/${{ matrix.target }}/release/kimo-mcp "dist/$name/bin/kimo-mcp"
          strip "dist/$name/bin/kimo-mcp" || true
          cp fonts/*.ttf fonts/fetch.sh "dist/$name/fonts/"
          cp README.md FEATURES.md "dist/$name/" 
          cp docs/RELEASE_BINARIES.md "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build .deb (static x86_64 build only)
        if: matrix.suffix == 'linux-x86_64-static'
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then dv="${GITHUB_REF_NAME#v}"; else dv="0~${GITHUB_SHA::8}"; fi
          d="dist/kimo_${dv}_amd64"
          mkdir -p "$d/DEBIAN" "$d/usr/lib/kimo/bin" "$d/usr/lib/kimo/fonts" "$d/usr/bin" "$d/usr/share/doc/kimo"
          install -m755 target/${{ matrix.target }}/release/kimo-mcp "$d/usr/lib/kimo/bin/kimo-mcp"
          strip "$d/usr/lib/kimo/bin/kimo-mcp" || true
          ln -s /usr/lib/kimo/bin/kimo-mcp "$d/usr/bin/kimo-mcp"
          cp fonts/*.ttf "$d/usr/lib/kimo/fonts/"
          cp README.md FEATURES.md LICENSE "$d/usr/share/doc/kimo/"
          cat > "$d/DEBIAN/control" <<CTRL
          Package: kimo
          Version: ${dv}
          Architecture: amd64
          Maintainer: naman-sharma12345
          Depends: ffmpeg
          Description: MCP-first video editor (stdio MCP server)
           kimo-mcp speaks the Model Context Protocol over stdin/stdout.
           Bundled fonts live in /usr/lib/kimo/fonts, found relative to the binary.
          CTRL
          dpkg-deb --root-owner-group --build "$d" "dist/kimo_${dv}_amd64.deb"
          dpkg-deb --info "dist/kimo_${dv}_amd64.deb"
          (cd dist && sha256sum "kimo_${dv}_amd64.deb" > "kimo_${dv}_amd64.deb.sha256")
          echo "debname=kimo_${dv}_amd64" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256

  windows:
    name: build (windows-x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: windows-x86_64-v2-${{ hashFiles('Cargo.lock') }}
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and package Windows
        shell: pwsh
        run: |
          # Tag builds take the version from the tag (v3.0.0 -> 3.0.0); other runs use Cargo.toml.
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value }
          ./packaging/windows/build.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimo-windows-x86_64
          path: dist/*
          if-no-files-found: error

  # Kimo Spectator desktop app (crates/kimo-gui). It is its own Cargo workspace,
  # not a member of the root one, so tauri-action is pointed at it with projectPath.
  gui:
    name: spectator (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            rust_targets: ""
            args: "--bundles deb,appimage"
          - os: windows-latest
            label: windows-x86_64
            rust_targets: ""
            args: "--bundles msi"
          # One universal .dmg (Apple silicon + Intel) from the arm64 runner.
          - os: macos-latest
            label: macos-universal
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system packages (WebKitGTK 4.1, libsoup 3, AppImage tooling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          for t in ${{ matrix.rust_targets }}; do rustup target add "$t"; done
          rustc -V

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/kimo-gui/target
          key: gui-${{ matrix.label }}-${{ hashFiles('crates/kimo-gui/Cargo.toml') }}
          restore-keys: gui-${{ matrix.label }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Tauri CLI (exact version)
        shell: bash
        run: |
          npm install -g "@tauri-apps/cli@${TAURI_CLI_VERSION}"
          tauri --version

      - name: App version from the tag (v1.2.3 -> 1.2.3; other runs keep tauri.conf.json)
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '{"version":"%s"}\n' "$v" > crates/kimo-gui/tauri.release-version.json
            echo "extra=--config tauri.release-version.json" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with tauri-action
        id: tauri
        continue-on-error: ${{ runner.os == 'Windows' }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: crates/kimo-gui
          tauriScript: tauri
          args: ${{ matrix.args }} ${{ steps.ver.outputs.extra }}

      # Windows: the .msi needs WiX. If that bundle fails, fall back to the NSIS setup .exe.
      - name: Windows fallback, NSIS installer
        if: runner.os == 'Windows' && steps.tauri.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: crates/kimo-gui
          tauriScript: tauri
          args: --bundles nsis ${{ steps.ver.outputs.extra }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find crates/kimo-gui/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -print0 | while IFS= read -r -d '' f; do
              b="$(basename "$f")"; cp "$f" "dist/${b// /-}"
            done
          ls -l dist
          case "$RUNNER_OS" in
            Linux)   ls dist/*.deb >/dev/null && ls dist/*.AppImage >/dev/null ;;
            Windows) ls dist/*.msi >/dev/null 2>&1 || ls dist/*-setup.exe >/dev/null ;;
            macOS)   ls dist/*.dmg >/dev/null ;;
          esac

      - name: Linux smoke test (dpkg metadata, install, headless launch, uninstall)
        if: runner.os == 'Linux'
        run: |
          deb=$(find dist -maxdepth 1 -name '*.deb' | head -1)
          dpkg-deb --info "$deb"
          sudo apt-get install -y --no-install-recommends xvfb "./$deb"
          bin=$(dpkg -L kimo-spectator | grep -m1 '^/usr/bin/')
          set +e
          timeout 5 xvfb-run -a "$bin"; rc=$?
          set -e
          echo "exit after 5 s: $rc (124 = still running when stopped = started fine)"
          test "$rc" -eq 124
          sudo dpkg -r kimo-spectator
          ! dpkg -s kimo-spectator 2>/dev/null | grep -q '^Status: install ok installed'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kimo-spectator-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [build, windows, gui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          ls -l
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort > ../files.txt
          test -s ../files.txt
          xargs -d '\n' sha256sum -- < ../files.txt > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  release:
    name: draft release (never published)
    needs: [build, windows, gui, checksums]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
          && (github.event_name == 'push' || inputs.draft_release)
          && needs.build.result == 'success' && needs.windows.result == 'success'
          && needs.gui.result == 'success' && needs.checksums.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ls -l artifacts
          cat > notes.md <<'NOTES'
          Unsigned builds. macOS: right-click the app > Open (or `xattr -d com.apple.quarantine "/Applications/Kimo Spectator.app"`).
          Windows: SmartScreen > More info > Run anyway. Verify downloads against SHA256SUMS.
          NOTES
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $tag is already published. This workflow only touches drafts; refusing to change it."
              exit 1
            fi
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --draft --verify-tag --title "kimo $tag" --notes-file notes.md
          fi
          test "$(gh release view "$tag" --json isDraft -q .isDraft)" = true
